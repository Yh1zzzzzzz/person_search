[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gram-person-search"
version = "0.1.0"
description = "Minimal implementation of GRAM for multilingual text-based person retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "torch>=2.7,<3",
  "transformers>=5.0,<6",
  "pillow>=10",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.setuptools.packages.find]
include = ["gram*"]

[tool.ruff]
line-length = 100
target-version = "py311"
